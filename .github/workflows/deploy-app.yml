name: Deploy PWA App

on:
  push:
    branches: [main]
    paths:
      - 'asy-syifaa-app/**'
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ] && missing="$missing VPS_HOST"
          [ -z "${{ secrets.VPS_USER }}" ] && missing="$missing VPS_USER"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          sparse-checkout: asy-syifaa-app

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: asy-syifaa-app/pwa/package-lock.json

      - name: Install and Build
        working-directory: asy-syifaa-app/pwa
        run: |
          npm ci
          npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "asy-syifaa-app/pwa/dist/*"
          target: "/opt/asy-syifaa-app/dist/"
          strip_components: 3
          overwrite: true

      - name: Restart PWA container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            FILE_COUNT=$(find /opt/asy-syifaa-app/dist -type f 2>/dev/null | wc -l)
            echo "==> $FILE_COUNT files deployed"
            if [ "$FILE_COUNT" -gt 0 ]; then
              cd /opt/asy-syifaa-app
              docker compose restart 2>/dev/null || docker restart asy-syifaa-pwa 2>/dev/null || true
              echo "==> PWA deploy complete!"
            else
              echo "::error::No files deployed!"
              exit 1
            fi
