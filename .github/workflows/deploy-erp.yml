name: Deploy ERP to VPS

on:
  push:
    branches: [main]
    paths:
      - 'asy-syifaa-erp/**'
  workflow_dispatch:

concurrency:
  group: deploy-erp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ] && missing="$missing VPS_HOST"
          [ -z "${{ secrets.VPS_USER }}" ] && missing="$missing VPS_USER"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          sparse-checkout: asy-syifaa-erp

      - name: Deploy ERP to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "asy-syifaa-erp/*"
          target: "/opt/asy-syifaa/erp/src/"
          strip_components: 1
          overwrite: true

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /opt/asy-syifaa/erp
            echo "==> Clearing old caches..."
            docker compose exec -T app php artisan optimize:clear 2>&1 || true
            echo "==> Restarting PHP-FPM (clear OPcache)..."
            docker compose restart app 2>&1 || true
            sleep 3
            echo "==> Running composer install..."
            docker compose exec -T app composer install --no-interaction --no-dev --optimize-autoloader 2>&1 || echo "Warning: composer install skipped"
            echo "==> Running migrations..."
            docker compose exec -T app php artisan migrate --force 2>&1 || echo "Warning: migration skipped"
            echo "==> Caching config/routes/views..."
            docker compose exec -T app php artisan config:cache 2>&1 || echo "Warning: config cache skipped"
            docker compose exec -T app php artisan route:cache 2>&1 || echo "Warning: route cache skipped"
            docker compose exec -T app php artisan view:cache 2>&1 || echo "Warning: view cache skipped"
            echo "==> Restarting all containers..."
            docker compose restart 2>&1 || echo "Warning: restart skipped"
            sleep 2
            echo "==> ERP deploy complete!"
