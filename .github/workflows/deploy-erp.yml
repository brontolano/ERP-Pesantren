name: Deploy ERP to VPS

on:
  push:
    branches: [main]
    paths:
      - 'asy-syifaa-erp/**'
  workflow_dispatch:

concurrency:
  group: deploy-erp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ] && missing="$missing VPS_HOST"
          [ -z "${{ secrets.VPS_USER }}" ] && missing="$missing VPS_USER"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing="$missing VPS_SSH_KEY"
          [ -z "${{ secrets.VPS_SSH_PASSPHRASE }}" ] && missing="$missing VPS_SSH_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          sparse-checkout: asy-syifaa-erp

      - name: Deploy ERP to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: "asy-syifaa-erp/*"
          target: "/opt/asy-syifaa/erp/src/"
          strip_components: 1
          overwrite: true

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            APP_DIR="/opt/asy-syifaa/erp"
            SRC_DIR="/opt/asy-syifaa/erp/src"

            [ -d "$APP_DIR" ] || { echo "::error::Missing $APP_DIR"; exit 1; }
            [ -f "$SRC_DIR/artisan" ] || { echo "::error::Missing $SRC_DIR/artisan"; exit 1; }

            cd "$APP_DIR"

            echo "==> Clearing old caches..."
            docker compose exec -T app php artisan optimize:clear

            echo "==> Installing PHP dependencies..."
            docker compose exec -T app composer install --no-interaction --no-dev --optimize-autoloader

            echo "==> Running migrations..."
            docker compose exec -T app php artisan migrate --force

            echo "==> Caching config/routes/views..."
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache

            echo "==> Restarting ERP containers..."
            docker compose restart
            sleep 3

            echo "==> Checking ERP health endpoint..."
            curl -fsS http://127.0.0.1:8080/up || curl -fsS http://127.0.0.1/up
            echo "==> ERP deploy complete"
