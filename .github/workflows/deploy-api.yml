name: Deploy API to VPS

on:
  push:
    branches: [main]
    paths:
      - 'asy-syifaa-api/**'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ] && missing="$missing VPS_HOST"
          [ -z "${{ secrets.VPS_USER }}" ] && missing="$missing VPS_USER"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing="$missing VPS_SSH_KEY"
          [ -z "${{ secrets.VPS_SSH_PASSPHRASE }}" ] && missing="$missing VPS_SSH_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - name: Deploy API via git pull on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            TARGET_DIR="/opt/asy-syifaa/backend"
            [ -d "$TARGET_DIR" ] || { echo "::error::Missing $TARGET_DIR"; exit 1; }

            cd "$TARGET_DIR"
            echo "==> Pulling latest changes..."
            git stash --include-untracked 2>/dev/null || true
            git pull origin main

            echo "==> Installing dependencies..."
            npm ci --omit=dev

            if [ -f prisma/schema.prisma ]; then
              echo "==> Running database migrations..."
              npx prisma migrate deploy
            fi

            echo "==> Restarting API via PM2..."
            pm2 restart asy-syifaa-api
            pm2 save || true
            sleep 3

            echo "==> Checking API health..."
            curl -fsS http://127.0.0.1:3100/api/health
            echo "==> API deploy complete"
