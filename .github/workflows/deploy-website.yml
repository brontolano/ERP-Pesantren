name: Deploy Website to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'asy-syifaa-website/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.HOSTINGER_HOST }}" || (echo "Missing secret: HOSTINGER_HOST" && exit 1)
          test -n "${{ secrets.HOSTINGER_USER }}" || (echo "Missing secret: HOSTINGER_USER" && exit 1)
          test -n "${{ secrets.HOSTINGER_SSH_KEY }}" || (echo "Missing secret: HOSTINGER_SSH_KEY" && exit 1)
          test -n "${{ secrets.HOSTINGER_PORT }}" || (echo "Missing secret: HOSTINGER_PORT" && exit 1)

      - uses: actions/checkout@v4
        with:
          sparse-checkout: asy-syifaa-website

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            if [ -d /opt/asy-syifaa/website/src ]; then
              TARGET_DIR=/opt/asy-syifaa/website/src
            elif [ -d ~/public_html ]; then
              TARGET_DIR=~/public_html
            else
              echo "No valid website target directory found."
              exit 1
            fi

            cd "$TARGET_DIR"
            git pull origin main -- asy-syifaa-website/
            cp -r asy-syifaa-website/* .
