name: Deploy Website to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'asy-syifaa-website/**'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.HOSTINGER_HOST }}" ] && missing="$missing HOSTINGER_HOST"
          [ -z "${{ secrets.HOSTINGER_USER }}" ] && missing="$missing HOSTINGER_USER"
          [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ] && missing="$missing HOSTINGER_SSH_KEY"
          [ -z "${{ secrets.HOSTINGER_PORT }}" ] && missing="$missing HOSTINGER_PORT"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: asy-syifaa-website

      - name: Deploy to Hostinger via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}

          port: ${{ secrets.HOSTINGER_PORT }}
          source: "asy-syifaa-website/*"
          target: ${{ secrets.HOSTINGER_DEPLOY_PATH || 'public_html' }}
          strip_components: 1
          overwrite: true

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}

          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            TARGET="${HOSTINGER_DEPLOY_PATH:-$HOME/public_html}"
            if [ -f "$TARGET/index.php" ] || [ -f "$TARGET/index.html" ]; then
              echo "==> Website deploy complete!"
            else
              echo "==> Warning: No index file found at $TARGET"
            fi
