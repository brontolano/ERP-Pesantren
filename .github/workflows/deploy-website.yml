name: Deploy Website to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'asy-syifaa-website/**'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.HOSTINGER_HOST }}" ] && missing="$missing HOSTINGER_HOST"
          [ -z "${{ secrets.HOSTINGER_USER }}" ] && missing="$missing HOSTINGER_USER"
          [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ] && missing="$missing HOSTINGER_SSH_KEY"
          [ -z "${{ secrets.HOSTINGER_PORT }}" ] && missing="$missing HOSTINGER_PORT"
          [ -z "${{ secrets.HOSTINGER_DEPLOY_PATH }}" ] && missing="$missing HOSTINGER_DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          sparse-checkout: asy-syifaa-website

      - name: Deploy to Hostinger via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}

          port: ${{ secrets.HOSTINGER_PORT }}
          source: "asy-syifaa-website/*"
          target: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        env:
          EXPECT_TOKEN_1: "nama_wali"
          EXPECT_TOKEN_2: "alamat_wali_jalan"
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}

          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            TARGET="${{ secrets.HOSTINGER_DEPLOY_PATH }}"

            if [ -f "$TARGET/index.php" ] || [ -f "$TARGET/index.html" ]; then
              echo "==> Website deploy complete at $TARGET"
            else
              echo "==> Warning: No index file found at $TARGET"
            fi

            if [ -f "$TARGET/daftar-sekarang.php" ]; then
              if grep -q "$EXPECT_TOKEN_1" "$TARGET/daftar-sekarang.php" && grep -q "$EXPECT_TOKEN_2" "$TARGET/daftar-sekarang.php"; then
                echo "==> Verified: daftar-sekarang.php contains latest standardized fields"
              else
                echo "::error::daftar-sekarang.php found but expected tokens missing. Possible wrong deploy target or stale source."
                exit 1
              fi
            else
              echo "::error::daftar-sekarang.php not found at $TARGET"
              exit 1
            fi
