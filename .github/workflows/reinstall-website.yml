name: Reinstall Website on VPS

on:
  workflow_dispatch:
    inputs:
      clean_install:
        description: 'Hapus semua file lama sebelum deploy?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: reinstall-website
  cancel-in-progress: false

env:
  VPS_HOST: ${{ secrets.HOSTINGER_HOST }}
  VPS_USER: ${{ secrets.HOSTINGER_USER }}
  VPS_PORT: ${{ secrets.HOSTINGER_PORT }}
  DEPLOY_PATH: /opt/asy-syifaa/website/src

jobs:
  reinstall:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate secrets
        run: |
          missing=""
          [ -z "$VPS_HOST" ] && missing="$missing HOSTINGER_HOST"
          [ -z "$VPS_USER" ] && missing="$missing HOSTINGER_USER"
          [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ] && missing="$missing HOSTINGER_SSH_KEY"
          [ -z "$VPS_PORT" ] && missing="$missing HOSTINGER_PORT"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          sparse-checkout: asy-syifaa-website

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Trust VPS host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Detect VPS state
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<'SCRIPT'
            set -e
            echo "===== VPS INFO ====="
            uname -a
            echo ""
            echo "PHP: $(php -v 2>/dev/null | head -1 || echo 'not found')"
            echo "Nginx: $(nginx -v 2>&1 || echo 'not found')"

            # Detect PHP-FPM socket
            for sock in /run/php/php*-fpm.sock /var/run/php/php*-fpm.sock; do
              [ -S "$sock" ] 2>/dev/null && echo "PHP-FPM: $sock" && break
            done

            echo ""
            echo "===== EXISTING FILES ====="
            if [ -d "/opt/asy-syifaa/website/src" ]; then
              echo "Files at /opt/asy-syifaa/website/src:"
              ls -la /opt/asy-syifaa/website/src/ | head -15
              echo "Total: $(find /opt/asy-syifaa/website/src -type f 2>/dev/null | wc -l) files"
            else
              echo "Deploy dir does not exist yet"
            fi
          SCRIPT

      - name: Clean old installation
        if: ${{ inputs.clean_install == 'true' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<'SCRIPT'
            set -e
            DEPLOY_PATH="/opt/asy-syifaa/website/src"

            # Backup .env if exists
            [ -f "$DEPLOY_PATH/.env" ] && cp "$DEPLOY_PATH/.env" /tmp/.asy-syifaa-env-backup && echo "Backed up .env"

            rm -rf "$DEPLOY_PATH"
            mkdir -p "$DEPLOY_PATH"
            echo "Old files cleaned, fresh dir created"
          SCRIPT

      - name: Deploy website files
        run: |
          rsync -avz --delete \
            -e "ssh -p $VPS_PORT" \
            asy-syifaa-website/ \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          echo "Files synced to VPS"

      - name: Configure and verify
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<'SCRIPT'
            set -e
            DEPLOY_PATH="/opt/asy-syifaa/website/src"

            # Restore .env if backed up
            if [ -f /tmp/.asy-syifaa-env-backup ]; then
              cp /tmp/.asy-syifaa-env-backup "$DEPLOY_PATH/.env"
              rm /tmp/.asy-syifaa-env-backup
              echo "Restored .env"
            fi

            # Create required directories
            mkdir -p "$DEPLOY_PATH/storage/sessions"
            mkdir -p "$DEPLOY_PATH/storage/logs"

            # Set permissions
            WEBUSER="www-data"
            id "$WEBUSER" &>/dev/null || WEBUSER=$(whoami)
            chown -R "$WEBUSER:$WEBUSER" "$DEPLOY_PATH" 2>/dev/null || true
            chmod -R 755 "$DEPLOY_PATH"
            chmod -R 775 "$DEPLOY_PATH/storage" 2>/dev/null || true

            echo "Files deployed: $(find "$DEPLOY_PATH" -type f | wc -l)"

            # === Nginx config ===
            echo ""
            echo "===== Configuring Nginx ====="

            # Detect PHP-FPM socket
            PHP_FPM_SOCK=""
            for sock in /run/php/php*-fpm.sock /var/run/php/php*-fpm.sock; do
              if [ -S "$sock" ] 2>/dev/null; then
                PHP_FPM_SOCK="$sock"
                break
              fi
            done
            [ -z "$PHP_FPM_SOCK" ] && PHP_FPM_SOCK="127.0.0.1:9000"
            echo "PHP-FPM: $PHP_FPM_SOCK"

            NGINX_CONF="/etc/nginx/sites-available/asy-syifaa-website"

            if [ -f "$DEPLOY_PATH/nginx.conf" ]; then
              cp "$DEPLOY_PATH/nginx.conf" "$NGINX_CONF"

              # Patch root path
              sed -i "s|root /opt/asy-syifaa/website/src;|root $DEPLOY_PATH;|g" "$NGINX_CONF"

              # Patch PHP-FPM
              if echo "$PHP_FPM_SOCK" | grep -q "\.sock$"; then
                sed -i "s|fastcgi_pass unix:/run/php/php-fpm.sock;|fastcgi_pass unix:$PHP_FPM_SOCK;|g" "$NGINX_CONF"
              else
                sed -i "s|fastcgi_pass unix:/run/php/php-fpm.sock;|fastcgi_pass $PHP_FPM_SOCK;|g" "$NGINX_CONF"
              fi

              echo "Nginx config written"
            else
              echo "::warning::nginx.conf not in deploy, skipping"
            fi

            if ! grep -Fq 'try_files $uri $uri/ /router.php?$query_string;' "$NGINX_CONF"; then
              echo "::error::Nginx fallback must target router.php for clean URL routing"
              exit 1
            fi

            ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/asy-syifaa-website 2>/dev/null || true
            nginx -t 2>&1
            systemctl reload nginx 2>/dev/null || nginx -s reload 2>/dev/null || service nginx reload
            echo "Nginx reloaded"

            # === Verification ===
            echo ""
            echo "===== VERIFICATION ====="
            [ -f "$DEPLOY_PATH/index.php" ] && echo "[OK] index.php" || echo "[FAIL] index.php missing!"
            [ -f "$DEPLOY_PATH/router.php" ] && echo "[OK] router.php" || echo "[FAIL] router.php missing!"
            [ -f "$DEPLOY_PATH/daftar-sekarang.php" ] && echo "[OK] daftar-sekarang.php" || echo "[WARN] daftar-sekarang.php missing"
            [ -d "$DEPLOY_PATH/assets" ] && echo "[OK] assets/" || echo "[WARN] assets/ missing"
            [ -d "$DEPLOY_PATH/src" ] && echo "[OK] src/" || echo "[WARN] src/ missing"

            echo ""
            php -r "echo 'PHP ' . PHP_VERSION . ' OK' . PHP_EOL;"

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ 2>/dev/null || echo "failed")
            echo "HTTP response: $HTTP_CODE"

            echo ""
            echo "===== DEPLOYMENT COMPLETE ====="
          SCRIPT
