server {
    listen 80;
    server_name asy-syifaa.com www.asy-syifaa.com;

    root /opt/asy-syifaa/website/src;
    index index.php index.html;

    charset utf-8;

    # Serve static files directly, fallback to router.php
    location / {
        try_files $uri $uri/ /router.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files and sensitive dirs
    location ~ /\. {
        deny all;
    }
    location ~ ^/(src|vendor|storage|backups)/ {
        deny all;
    }
    location ~ (composer\.json|composer\.lock|package\.json|package-lock\.json|\.htaccess)$ {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    access_log /var/log/nginx/asy-syifaa-website-access.log;
    error_log /var/log/nginx/asy-syifaa-website-error.log;
}
