name: Auto Deploy ERP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-erp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Deploy ERP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s <<'DEPLOY'
            set -e
            cd /opt/asy-syifaa/erp/src
            git pull origin main

            # Clear & rebuild Laravel cache di dalam container
            cd /opt/asy-syifaa/erp
            docker compose exec -T app php artisan config:cache 2>/dev/null || true
            docker compose exec -T app php artisan route:cache 2>/dev/null || true
            docker compose exec -T app php artisan view:cache 2>/dev/null || true
            docker compose exec -T app php artisan migrate --force 2>/dev/null || true

            echo "ERP deployed successfully at $(date)"
          DEPLOY
