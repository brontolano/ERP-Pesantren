version: "3.9"

services:
  # PostgreSQL Database
  postgresql:
    image: postgres:16-alpine
    container_name: asy-syifaa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_pesantren
      POSTGRES_USER: pesantren
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ASy-5Yifaa}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - asy-syifaa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesantren"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend ERP (Laravel + Filament)
  erp-app:
    build:
      context: ./asy-syifaa-erp
      dockerfile: Dockerfile
    container_name: erp-app
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://erp.asy-syifaa.com
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: erp_pesantren
      DB_USERNAME: pesantren
      DB_PASSWORD: ${DB_PASSWORD:-ASy-5Yifaa}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./asy-syifaa-erp/storage:/var/www/html/storage
      - ./asy-syifaa-erp/bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - asy-syifaa-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  erp-nginx:
    image: nginx:alpine
    container_name: erp-nginx
    restart: unless-stopped
    depends_on:
      - erp-app
    volumes:
      - ./asy-syifaa-erp/public:/var/www/html/public:ro
      - ./asy-syifaa-erp/storage:/var/www/html/storage:ro
      - ./asy-syifaa-erp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - asy-syifaa-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erp.rule=Host(`erp.asy-syifaa.com`)"
      - "traefik.http.routers.erp.entrypoints=websecure"
      - "traefik.http.routers.erp.tls.certresolver=letsencrypt"
      - "traefik.http.services.erp.loadbalancer.server.port=80"

  # Backend API (Node.js + Express) — DataMaster
  api-app:
    build:
      context: ./asy-syifaa-api
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: asy-syifaa-api:latest
    container_name: api-app
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: erp_pesantren
      DB_USER: pesantren
      DB_PASSWORD: ${DB_PASSWORD:-ASy-5Yifaa}
      REDIS_URL: redis://redis:6379
      API_BASE_URL: https://api.asy-syifaa.com
      ERP_API_URL: https://erp.asy-syifaa.com/api
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    networks:
      - asy-syifaa-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-nginx:
    image: nginx:alpine
    container_name: api-nginx
    restart: unless-stopped
    depends_on:
      - api-app
    volumes:
      - ./asy-syifaa-api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - asy-syifaa-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.asy-syifaa.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=80"

  # Website (PHP native)
  website-fpm:
    build:
      context: ./asy-syifaa-website
      dockerfile: Dockerfile
    image: asy-syifaa-website:latest
    container_name: website-fpm
    restart: unless-stopped
    volumes:
      - ./asy-syifaa-website:/var/www/html:ro
    networks:
      - asy-syifaa-net

  website-nginx:
    image: nginx:alpine
    container_name: website-nginx
    restart: unless-stopped
    depends_on:
      - website-fpm
    volumes:
      - ./asy-syifaa-website:/var/www/html:ro
      - ./asy-syifaa-website/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - asy-syifaa-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`www.asy-syifaa.com`) || Host(`asy-syifaa.com`)"
      - "traefik.http.routers.website.entrypoints=websecure"
      - "traefik.http.routers.website.tls.certresolver=letsencrypt"
      - "traefik.http.services.website.loadbalancer.server.port=80"

  # PWA App (Vue 3)
  pwa:
    build:
      context: ./asy-syifaa-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: https://api.asy-syifaa.com
        VITE_ERP_BASE: https://erp.asy-syifaa.com
        VITE_DEMO_MODE: "false"
    image: asy-syifaa-pwa:latest
    container_name: pwa
    restart: unless-stopped
    networks:
      - asy-syifaa-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pwa.rule=Host(`app.asy-syifaa.com`)"
      - "traefik.http.routers.pwa.entrypoints=websecure"
      - "traefik.http.routers.pwa.tls.certresolver=letsencrypt"
      - "traefik.http.services.pwa.loadbalancer.server.port=80"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: asy-syifaa-redis
    restart: unless-stopped
    networks:
      - asy-syifaa-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Traefik Reverse Proxy + SSL
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@asy-syifaa.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - asy-syifaa-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.asy-syifaa.com`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

networks:
  asy-syifaa-net:
    driver: bridge

volumes:
  postgresql_data:
    driver: local
