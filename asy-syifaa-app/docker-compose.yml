version: "3.9"

# PWA Asy-Syifaa App — app.asy-syifaa.com
# Deploy di VPS bersama ERP pesantren
# Traefik otomatis handle SSL dari Let's Encrypt

services:
  pwa:
    build:
      context: ./pwa
      dockerfile: Dockerfile
      args:
        # Variabel build-time untuk Vite
        VITE_API_BASE: ${VITE_API_BASE:-https://api.asy-syifaa.com}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    image: asy-syifaa-pwa:latest
    container_name: asy-syifaa-pwa
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"

      # Router HTTP → redirect ke HTTPS
      - "traefik.http.routers.pwa-http.rule=Host(`app.asy-syifaa.com`)"
      - "traefik.http.routers.pwa-http.entrypoints=web"
      - "traefik.http.routers.pwa-http.middlewares=https-redirect"

      # Router HTTPS
      - "traefik.http.routers.pwa-https.rule=Host(`app.asy-syifaa.com`)"
      - "traefik.http.routers.pwa-https.entrypoints=websecure"
      - "traefik.http.routers.pwa-https.tls=true"
      - "traefik.http.routers.pwa-https.tls.certresolver=letsencrypt"

      # Service port
      - "traefik.http.services.pwa.loadbalancer.server.port=80"

      # Middleware HTTPS redirect (shared)
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

# Gunakan network yang sama dengan Traefik & ERP
networks:
  traefik-public:
    external: true
